name: Test macOS agent imports

# Phase 2 boundary: the agent must import and register its handlers on macOS
# without loading a Windows backend. Offline only; never touches a game.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-macos-imports-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  imports:
    # Pure Python on the pinned wheels: any macOS architecture will do. The Apple silicon pool hit
    # "capacity constraints" and cancelled this job unacquired on four pushes in a row (November 2026),
    # so it runs on the Intel image. The workflow is a signal, not a required check.
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install the pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Expose the wheel's MaaFramework binaries as ./maafw
        run: ln -s "$(python -c 'import maa, pathlib; print(pathlib.Path(maa.__file__).parent / "bin")')" maafw
      - name: Import and register the agent without a platform backend
        run: |
          python -B scripts/test_host_imports.py
          python -B scripts/test_host.py
          python -B scripts/test_app_paths.py
          python -B native/macos-control-unit/test_probe.py

  control-unit:
    # The patched Mac control unit from the pinned sources, in a fresh work directory. Never touches a
    # game. No Apple silicon runner has been assigned to this fork on macos-15 or macos-26 (November
    # 2026), so this runs on Intel and proves two narrower things, each named for what it shows. The
    # shipped arm64 binary's behaviour is still only verified on Apple silicon (the plan's risk list).
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: arm64 unit cross-compiles with the expected load commands and architecture (not executed)
        run: python -I native/macos-control-unit/build.py --unit-only --work "$RUNNER_TEMP/macos-control-unit"
      - name: Input logic tests pass on x86_64, built from the same sources (not the shipped binary)
        run: python -I native/macos-control-unit/build.py --tests-only --test-arch x86_64 --work "$RUNNER_TEMP/macos-control-unit"
      - name: Keep the cross-compiled unit and its manifest (verify this exact file on Apple silicon before shipping it)
        uses: actions/upload-artifact@v4
        with:
          name: macos-control-unit-arm64-cross
          path: |
            ${{ runner.temp }}/macos-control-unit/out/patched/build.json
            ${{ runner.temp }}/macos-control-unit/out/patched/libMaaMacOSControlUnit.dylib
