name: Test build Windows x64

# Builds the same packages as `scripts/build.ps1 -Action Package` for hands-on
# testing and uploads them as a workflow artifact. It never bumps versions,
# commits, tags, creates releases or triggers the publish/mirror workflows.
#
# Pull requests: add the `test-build` label (works for branches whose workflow
# file is not on the default branch); later pushes to a labelled PR rebuild.
# Manual: Actions -> Test build Windows x64 -> Run workflow, available once this
# file is on the default branch (GitHub only offers dispatch for those workflows).
on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Adding any other label to a labelled PR does not start another build.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'test-build') &&
       (github.event.action != 'labeled' || github.event.label.name == 'test-build'))
    # Job-level, so a skipped run (another label added) cannot cancel a build in progress.
    concurrency:
      group: test-build-windows-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the branch commit itself, not the synthetic merge with the base branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup show
      - name: Cache pinned runtime downloads
        # Files are re-verified against build/runtime.lock.json SHA-256 values before use.
        uses: actions/cache@v4
        with:
          path: .build/downloads
          key: runtime-downloads-${{ hashFiles('build/runtime.lock.json') }}
      - name: Build and verify release packages
        shell: pwsh
        run: ./scripts/build.ps1 -Action Package
      - name: Name the test artifact
        id: name
        shell: pwsh
        run: |
          $sha = '${{ github.event.pull_request.head.sha || github.sha }}'.Substring(0, 7)
          "artifact=MaaNikki-Windows-x64-test-$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload npm diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MaaNikki-test-build-npm-logs
          path: .build/npm-cache/_logs/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
